{% extends "base.html" %}
{% block title %}Edit Product - Inventicks{% endblock %}
{% block content %}

<div class="page-header">
    <h1>Edit product</h1>
</div>

<div class="panel">
    <form method="POST" style="border:none;padding:0;margin:0;">
        <label>Name</label>
        <input type="text" name="name" value="{{ product['name'] }}" required>
        <label>Price</label>
        <input type="number" step="0.01" name="price" value="{{ product['price'] }}" required>
        <label>Quantity</label>
        <input type="number" name="quantity" value="{{ product['quantity'] }}" required>
        <label>Category</label>
        <input type="text" name="category" value="{{ product['category'] or '' }}">
        <label>Unit</label>
        <input type="text" name="unit" value="{{ product['unit'] or 'pcs' }}">
        <br><br>
        <button type="submit">Update product</button>
        <a href="/inventory" class="btn btn-secondary" style="display:inline-block;">Cancel</a>
    </form>
</div>

{% endblock %}
