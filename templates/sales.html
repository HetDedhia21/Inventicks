{% extends "base.html" %}
{% block title %}Sales - Inventicks{% endblock %}
{% block content %}

<div class="page-header">
    <h1>New sale</h1>
</div>

<div class="panel">
    <h2>Customer</h2>
    <input type="text" id="phone" placeholder="Phone number">
    <input type="text" id="name" placeholder="Customer name">
    <p id="customer-info" style="font-size:13px;color:var(--text-muted);"></p>
</div>

<div class="panel">
    <h2>Add product</h2>
    <select id="product">
        {% for product in products %}
        <option value="{{ product[0] }}" data-price="{{ product[2] }}">
            {{ product[1] }} - {{ settings['currency_symbol'] if settings else '₹' }}{{ product[2] }}
        </option>
        {% endfor %}
    </select>
    <input type="number" id="qty" placeholder="Quantity" value="1">
    <button onclick="addToCart()">Add to cart</button>
</div>

<div class="panel">
    <h2>Cart</h2>
    <div id="cart"></div>
    <p style="font-size:16px;font-weight:600;margin-top:10px;">
        Total: {{ settings['currency_symbol'] if settings else '₹' }}<span id="total">0</span>
    </p>
</div>

<div class="panel">
    <h2>Payment</h2>
    <label for="discount">Discount</label>
    <input type="number" id="discount" name="discount" placeholder="Enter discount" value="">
    <label for="paid">Paid amount</label>
    <input type="number" id="paid" name="paid_amount" placeholder="Enter amount paid" value="">
    <br><br>
    <button id="sellBtn" type="button" onclick="submitSale()">Complete sale</button>
</div>

<script type="application/json" id="customer-data">
    {{ customers | tojson | default('[]') }}
</script>

{% endblock %}

{% block scripts %}
<script>
window.customers = JSON.parse(
    document.getElementById('customer-data').textContent || '[]'
);

document.getElementById('phone').addEventListener('input', function () {
    const phone = this.value;
    const customer = window.customers.find(c => c.phone === phone);

    if (customer) {
        document.getElementById('name').value = customer.name;
        document.getElementById('customer-info').innerText =
            `Existing customer | Due: ₹${customer.due_amount}`;
    } else {
        document.getElementById('name').value = '';
        document.getElementById('customer-info').innerText = 'New customer';
    }
});

let cart = [];

function addToCart() {
    const productSelect = document.getElementById('product');
    const productId = productSelect.value;
    const productName = productSelect.options[productSelect.selectedIndex].text;
    const price = parseFloat(productSelect.options[productSelect.selectedIndex].dataset.price);
    const qty = parseInt(document.getElementById('qty').value);

    if (!qty || qty <= 0) {
        alert("Enter valid quantity");
        return;
    }

    const existing = cart.find(p => p.id == productId);

    if (existing) {
        existing.quantity += qty;
    } else {
        cart.push({
            id: productId,
            name: productName,
            price: price,
            quantity: qty
        });
    }

    renderCart();
}

function renderCart() {
    const cartDiv = document.getElementById('cart');
    cartDiv.innerHTML = '';

    let total = 0;

    cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;

        cartDiv.innerHTML += `
            <p style="display:flex;justify-content:space-between;border-bottom:0.5px solid var(--line);padding:6px 0;margin:0;font-size:13px;">
                <span>${item.name} x ${item.quantity}</span>
                <span>₹${itemTotal} <button onclick="removeItem(${index})" style="margin-left:8px;padding:3px 8px;">Remove</button></span>
            </p>
        `;
    });

    document.getElementById('total').innerText = total;
}

function removeItem(index) {
    cart.splice(index, 1);
    renderCart();
}

function submitSale() {
    const btn = document.getElementById('sellBtn');
    if (btn.disabled) return;

    btn.disabled = true;
    btn.innerText = "Processing...";

    const phoneEl = document.getElementById('phone');
    const nameEl = document.getElementById('name');
    const paidEl = document.getElementById('paid');
    const discountEl = document.getElementById('discount');

    if (!phoneEl || !nameEl || !paidEl || !discountEl) {
        alert("Missing fields!");
        return;
    }

    const data = {
        phone: phoneEl.value,
        name: nameEl.value,
        cart: cart,
        discount: discountEl.value,
        paid_amount: paidEl.value
    };

    fetch('/sales', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(response => {
        alert("Sale completed!");
        location.reload();
    })
    .catch(err => {
        console.error(err);
        alert("Error processing sale");
        btn.disabled = false;
        btn.innerText = "Complete sale";
    });
}
</script>
{% endblock %}
