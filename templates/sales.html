<!DOCTYPE html>
<html>
<head>
    <title>POS Billing</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>

<h2>Billing System</h2>

<!-- ✅ CUSTOMER SECTION -->
<h3>Customer</h3>

<input type="text" id="phone" placeholder="Phone Number">
<input type="text" id="name" placeholder="Customer Name">
<p id="customer-info"></p>

<!-- ✅ PRODUCTS SECTION -->
<h3>Add Product</h3>

<select id="product">
    {% for product in products %}
    <option value="{{ product[0] }}" data-price="{{ product[2] }}">
        {{ product[1] }} - ₹{{ product[2] }}
    </option>
    {% endfor %}
</select>

<input type="number" id="qty" placeholder="Quantity" value="1">

<button onclick="addToCart()">Add to Cart</button>

<!-- ✅ CART DISPLAY -->
<h3>Cart</h3>
<div id="cart"></div>

<p><strong>Total: ₹<span id="total">0</span></strong></p>

<!-- ✅ PAYMENT SECTION -->
<h3>Payment</h3>

<input type="number" id="discount" placeholder="Discount" value="0">
<input type="number" id="paid" placeholder="Paid Amount" value="0">

<button onclick="submitSale()">Sell</button>

<!-- ✅ CUSTOMER DATA FROM BACKEND -->
<script type="application/json" id="customer-data">
    {{ customers | tojson | default('[]') }}
</script>

<script>
/* =========================
   LOAD CUSTOMER DATA
========================= */
window.customers = JSON.parse(
    document.getElementById('customer-data').textContent || '[]'
);

/* =========================
   CUSTOMER AUTO DETECT
========================= */
document.getElementById('phone').addEventListener('input', function () {
    const phone = this.value;

    const customer = window.customers.find(c => c.phone === phone);

    if (customer) {
        document.getElementById('name').value = customer.name;
        document.getElementById('customer-info').innerText =
            `Existing Customer | Due: ₹${customer.due_amount}`;
    } else {
        document.getElementById('name').value = '';
        document.getElementById('customer-info').innerText = 'New Customer';
    }
});

/* =========================
   CART SYSTEM
========================= */
let cart = [];

function addToCart() {
    const productSelect = document.getElementById('product');
    const productId = productSelect.value;
    const productName = productSelect.options[productSelect.selectedIndex].text;
    const price = parseFloat(productSelect.options[productSelect.selectedIndex].dataset.price);
    const qty = parseInt(document.getElementById('qty').value);

    if (!qty || qty <= 0) {
        alert("Enter valid quantity");
        return;
    }

    const existing = cart.find(p => p.id == productId);

    if (existing) {
        existing.quantity += qty;
    } else {
        cart.push({
            id: productId,
            name: productName,
            price: price,
            quantity: qty
        });
    }

    renderCart();
}

function renderCart() {
    const cartDiv = document.getElementById('cart');
    cartDiv.innerHTML = '';

    let total = 0;

    cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;

        cartDiv.innerHTML += `
            <p>
                ${item.name} x ${item.quantity} = ₹${itemTotal}
                <button onclick="removeItem(${index})">Remove</button>
            </p>
        `;
    });

    document.getElementById('total').innerText = total;
}

function removeItem(index) {
    cart.splice(index, 1);
    renderCart();
}

/* =========================
   SUBMIT SALE
========================= */
function submitSale() {
    const phone = document.getElementById('phone').value;
    const name = document.getElementById('name').value;
    const discount = parseFloat(document.getElementById('discount').value) || 0;
    const paid = parseFloat(document.getElementById('paid').value) || 0;

    if (!phone) {
        alert("Phone number required");
        return;
    }

    if (cart.length === 0) {
        alert("Cart is empty");
        return;
    }

    fetch('/sales', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            phone: phone,
            name: name,
            cart: cart,
            discount: discount,
            paid_amount: paid
        })
    })
    .then(res => res.json())
    .then(data => {
        alert("Sale Completed ✅");
        location.reload();
    })
    .catch(err => {
        console.error(err);
        alert("Error processing sale");
    });
}
</script>

</body>
</html>
